name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/front/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (compila TypeScript)
        run: npm run build

  back:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Tests
        run: ./mvnw -B test
      - name: Build
        run: ./mvnw -B -DskipTests package
