spring.application.name=FarmaSol-Back

# Configuración local sin Docker: si existe apps/back/.env (ver .env.example en
# esta carpeta), sus valores reemplazan a los de abajo. Así cada uno pone la
# contraseña de su MySQL en un archivo, en vez de pelearse con variables de
# entorno de Windows. Se busca en las dos rutas porque depende de desde dónde se
# arranque: mvnw o el IDE con apps/back abierto (la primera), o el IDE con todo el
# repo abierto (la segunda). "optional:" hace que no pase nada si no existe.
spring.config.import=optional:file:.env[.properties],optional:file:apps/back/.env[.properties]

# Puerto del servidor
server.port=8081

# Base de datos MySQL. Todo se configura por variables de entorno (ver
# .env.aiven.example en la raíz del monorepo). Los valores por defecto apuntan al
# MySQL que levanta docker compose, para que `docker compose up` funcione sin
# configurar nada.
#
# serverTimezone debe coincidir con la zona del JVM (la variable TZ del
# contenedor). Si no coinciden, el driver convierte las fechas al escribirlas: con
# el JVM en Lima y la conexión en UTC, un pedido de las 10pm se guardaba como las
# 3am del día siguiente, y salía del reporte del día.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:farmasol_db}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=${DB_TIMEZONE:America/Lima}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Seguridad / JWT
# En producción, sobreescribir con la variable de entorno FARMASOL_JWT_SECRET
farmasol.jwt.secret=${FARMASOL_JWT_SECRET:ZmFybWFzb2wtZGV2LXNlY3JldC1jYW1iaWFyLWVuLXByb2R1Y2Npb24tMjAyNi1jbGF2ZS1sYXJnYQ==}
farmasol.jwt.expiration-ms=86400000
farmasol.jwt.issuer=farmasol-back

# CORS (orígenes del frontend en desarrollo)
farmasol.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Reglas de negocio
# Envío gratis según el diseño; el IGV (18%) se muestra solo en el frontend.
farmasol.pedido.costo-envio=0.00

# Archivos de recetas médicas (fuera del repo; ver .gitignore)
farmasol.uploads.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
