spring.application.name=FarmaSol-Back

# Puerto del servidor
server.port=8080

# Base de datos MySQL. Todo se configura por variables de entorno (ver .env.example
# en la raíz del monorepo). Los valores por defecto apuntan al MySQL que levanta
# docker compose, para que `docker compose up` funcione sin configurar nada.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:farmasol_db}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Seguridad / JWT
# En producción, sobreescribir con la variable de entorno FARMASOL_JWT_SECRET
farmasol.jwt.secret=${FARMASOL_JWT_SECRET:ZmFybWFzb2wtZGV2LXNlY3JldC1jYW1iaWFyLWVuLXByb2R1Y2Npb24tMjAyNi1jbGF2ZS1sYXJnYQ==}
farmasol.jwt.expiration-ms=86400000
farmasol.jwt.issuer=farmasol-back

# CORS (orígenes del frontend en desarrollo)
farmasol.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Reglas de negocio
# Envío gratis según el diseño; el IGV (18%) se muestra solo en el frontend.
farmasol.pedido.costo-envio=0.00

# Archivos de recetas médicas (fuera del repo; ver .gitignore)
farmasol.uploads.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
