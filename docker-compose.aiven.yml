# Override para trabajar contra la BD compartida del equipo (Aiven) en vez del
# MySQL local. Se usa junto al compose principal:
#
#   docker compose --env-file .env.aiven -f docker-compose.yml -f docker-compose.aiven.yml up
#
# Requiere un .env.aiven con los datos de conexion (ver .env.aiven.example).
# Se usa un archivo aparte, y no .env, a proposito: si las credenciales de la
# BD compartida vivieran en .env, `docker compose up` las tomaria tambien y el
# modo local terminaria usando la nube sin avisar.

services:
  # `profiles` desactiva el MySQL local: con la BD en la nube no hace falta,
  # y dejarlo corriendo solo gasta memoria.
  db:
    profiles: ["no-usar"]

  back:
    # Sin el contenedor de BD, esperar por su healthcheck colgaria el arranque.
    depends_on: !reset []
